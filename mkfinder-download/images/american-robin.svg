<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- American Robin SVG -->
  <defs>
    <linearGradient id="robinBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robinBreast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robinHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#e8f5e8"/>
  
  <!-- Branch -->
  <rect x="0" y="160" width="300" height="8" rx="4" fill="#8b4513"/>
  
  <!-- Bird Body -->
  <ellipse cx="150" cy="120" rx="45" ry="35" fill="url(#robinBack)"/>
  
  <!-- Bird Breast -->
  <ellipse cx="150" cy="130" rx="35" ry="25" fill="url(#robinBreast)"/>
  
  <!-- Bird Head -->
  <circle cx="130" cy="85" r="25" fill="url(#robinHead)"/>
  
  <!-- White eye ring -->
  <circle cx="125" cy="80" r="8" fill="white"/>
  <circle cx="125" cy="80" r="5" fill="black"/>
  
  <!-- Beak -->
  <polygon points="105,85 95,88 105,91" fill="#f1c40f"/>
  
  <!-- Wing details -->
  <ellipse cx="165" cy="115" rx="20" ry="15" fill="#34495e" opacity="0.8"/>
  
  <!-- Tail -->
  <ellipse cx="190" cy="125" rx="25" ry="12" fill="url(#robinHead)"/>
  
  <!-- Legs -->
  <rect x="145" y="150" width="3" height="15" fill="#e67e22"/>
  <rect x="155" y="150" width="3" height="15" fill="#e67e22"/>
  
  <!-- Feet -->
  <ellipse cx="147" cy="167" rx="6" ry="2" fill="#e67e22"/>
  <ellipse cx="157" cy="167" rx="6" ry="2" fill="#e67e22"/>
  
  <!-- White markings around eye -->
  <path d="M 115 75 Q 120 70 130 75" stroke="white" stroke-width="2" fill="none"/>
  <path d="M 115 85 Q 120 90 130 85" stroke="white" stroke-width="2" fill="none"/>
</svg>